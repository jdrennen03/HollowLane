name: Build desktop apps

# Publishes a Release with Windows/Mac/Linux downloads. Either:
#  - Actions tab > "Build desktop apps" > Run workflow, type a version like v1.0.1 (leave blank for a test build), or
#  - push a git tag like v1.0.1.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.0.1 (blank = test build only, zips under the run's Artifacts)"
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win32, arch: x64, zip: HollowLane-Windows-x64.zip }
          - { os: macos-latest, platform: darwin, arch: arm64, zip: HollowLane-Mac-AppleSilicon.zip }
          - { os: macos-latest, platform: darwin, arch: x64, zip: HollowLane-Mac-Intel.zip }
          - { os: ubuntu-latest, platform: linux, arch: x64, zip: HollowLane-Linux-x64.zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run stage
      - run: node pack.js
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
      - name: Zip
        run: |
          cd dist
          D="Hollow Lane-${{ matrix.platform }}-${{ matrix.arch }}"
          case "${{ matrix.platform }}" in
            darwin) ditto -c -k --sequesterRsrc --keepParent "$D" "../${{ matrix.zip }}" ;;
            win32)  7z a -tzip -mx=7 "../${{ matrix.zip }}" "$D" ;;
            *)      zip -qry -9 "../${{ matrix.zip }}" "$D" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: desktop/${{ matrix.zip }}
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: out/*.zip
          generate_release_notes: true
