name: Build desktop apps

# Push a tag like v1.0.0 to publish a Release with Windows/Mac/Linux downloads.
# "Run workflow" on the Actions tab builds the same files as downloadable artifacts (no Release).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win32, arch: x64, zip: HollowLane-Windows-x64.zip }
          - { os: macos-latest, platform: darwin, arch: arm64, zip: HollowLane-Mac-AppleSilicon.zip }
          - { os: macos-latest, platform: darwin, arch: x64, zip: HollowLane-Mac-Intel.zip }
          - { os: ubuntu-latest, platform: linux, arch: x64, zip: HollowLane-Linux-x64.zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run stage
      - run: node pack.js
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
      - name: Zip
        run: |
          cd dist
          D="Hollow Lane-${{ matrix.platform }}-${{ matrix.arch }}"
          case "${{ matrix.platform }}" in
            darwin) ditto -c -k --sequesterRsrc --keepParent "$D" "../${{ matrix.zip }}" ;;
            win32)  7z a -tzip -mx=7 "../${{ matrix.zip }}" "$D" ;;
            *)      zip -qry -9 "../${{ matrix.zip }}" "$D" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: desktop/${{ matrix.zip }}
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
